  let transient = null; // { text, undo }
  const noteEls = new Map();
  const vp = () => ({ w: document.documentElement.clientWidth, h: document.documentElement.clientHeight });
  const byId = (id) => notes.find((n) => n.id === id);
  const newId = () => `n${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
  const topZ = () => notes.reduce((m, n) => Math.max(m, n.z), 0);

  // Several tabs can be open on the same store (every server start opens a new one). A tab never writes its own
  // snapshot over newer stored notes: before each write, and on each storage event, it merges by id.
  // known = ids this tab last saw in storage; gone = ids this tab deleted (so a stale stored copy is not re-adopted).
  const known = new Set(), gone = new Set();
  const look = (o) => JSON.stringify([o.x, o.y, o.z, o.angle, o.font, o.size, o.color, o.pinned]); // everything but the text
  function mergeStored(live) {
    const s = sanitizeNotes(notesStore.get(NOTES_KEY));
    if (s.bad) return;
    rest = s.rest;
    const stored = new Map(s.notes.map((r) => [r.id, r]));
    const active = document.activeElement;
    let changed = false;
    for (const n of notes.slice()) {
      const el = noteEls.get(n.id);
      const dirty = !!saveTimer; // typed here, not saved yet
      const typing = dirty || (el && active && el.contains(active) && active.matches('.n-text')); // keep caret and text
      const r = stored.get(n.id);
      if (!r) {
        if (!known.has(n.id)) continue; // new in this tab, not saved yet
        if (dirty) { known.delete(n.id); continue; } // deleted elsewhere but being typed here: keep it and save it again
        dropNote(n); changed = true;
      } else if (live && !dirty && !(drag && drag.n === n)) {
        if (!typing && n.text !== r.text) { n.text = r.text; if (el) el.querySelector('.n-text').value = r.text; changed = true; }
        if (look(n) !== look(r)) { n.x = r.x; n.y = r.y; n.z = r.z; n.angle = r.angle; n.font = r.font; n.size = r.size; n.color = r.color; n.pinned = r.pinned; changed = true; }
      }
    }
    for (const r of s.notes) {
      known.add(r.id);
      if (byId(r.id) || gone.has(r.id)) continue;
      if (notes.length >= NOTE.max) { rest.push(r); continue; } // over the limit: kept unchanged in storage
      const n = { ...r, fresh: false, unsaved: false };
      notes.push(n); buildNote(n); changed = true;
    }
    if (changed) { paintAll(); syncCtl(); }
  }

  function persist() {
    if (!notesReady) return;
    clearTimeout(saveTimer); saveTimer = 0;
    if (!DEMO_PAGE) mergeStored(false);
    let ok = true;
    if (rawBad != null && !rawKept) { ok = notesStore.set(`${NOTES_KEY}-unreadable`, rawBad); rawKept = ok; } // never overwrite what we could not read
    const recs = notes.filter((n) => !n.fresh || n.text).map(({ id, text, x, y, z, angle, font, size, color, pinned }) => ({ id, text, x, y, z, angle, font, size, color, pinned }));
    ok = ok && notesStore.set(NOTES_KEY, JSON.stringify({ v: 2, notes: recs.concat(rest) }));
    if (ok) { known.clear(); for (const r of recs) known.add(r.id); }
    saveFailed = !ok;
    for (const n of notes) { n.unsaved = !ok; paintNote(n); }
    drawStatus();
  }
  const persistSoon = () => { clearTimeout(saveTimer); saveTimer = setTimeout(persist, 400); };

  // The text is drawn twice: the textarea holds the real text and caret (its glyphs are transparent), .n-view draws the
  // same characters styled: the title line, bullets and struck bullets. Neither is ever wider than the other, so they line up.
  function drawView(n) {
    const view = noteEls.get(n.id).querySelector('.n-view');
    const lines = n.text.split('\n');
    const titled = lines.length > 1 && lines[0].trim() !== '' && !lineKind(lines[0]);
    const frag = document.createDocumentFragment();
    lines.forEach((ln, i) => {
      const kind = lineKind(ln);
      if (kind) {
        const mk = document.createElement('span'); mk.className = 'mk'; mk.textContent = ln[0];
        const tx = document.createElement('span'); if (kind === 'done') tx.className = 'sx'; tx.textContent = ln.slice(2);
        frag.append(mk, ' ', tx);
      } else if (i === 0 && titled) {
        const t = document.createElement('span'); t.className = 'ti'; t.textContent = ln; frag.append(t);
      } else frag.append(ln);
      frag.append('\n');
    });
    view.replaceChildren(frag);
  }
  // No scrollbar: the font steps down until the text fits the paper. Returns true when it still does not fit at the smallest size.
  function fitNote(n) {
    const el = noteEls.get(n.id), ta = el.querySelector('.n-text');
    let s = n.size;
    el.style.setProperty('--fs', `${s}px`);
    if (!ta.clientHeight) { n.fit = s; return false; }
    while (s > TILT.minSize && ta.scrollHeight > ta.clientHeight + 1) { s -= 1; el.style.setProperty('--fs', `${s}px`); }
    n.fit = s;
    return ta.scrollHeight > ta.clientHeight + 1;
  }
  const effZ = (n) => (n.pinned ? 100000 : 0) + Math.round(n.z); // a pinned note stays above the others

  function paintNote(n) {
    const el = noteEls.get(n.id);
    if (!el) return;
    const title = noteTitle(n.text);
    const shown = title || L.newNote;
    const p = resolvePos(n.x, n.y, vp().w, vp().h);
    el.style.left = `${p.left}px`; el.style.top = `${p.top}px`;
    el.style.zIndex = String(effZ(n));
    el.style.setProperty('--a', `${n.angle}deg`);
    el.dataset.c = n.color; el.dataset.f = n.font;
    el.classList.toggle('pinned', n.pinned); el.classList.toggle('piled', !!n.piled);
    el.querySelector('.n-ear').hidden = !n.pinned;
    el.setAttribute('aria-label', L.noteGroup(shown));
    el.querySelector('.n-hint').textContent = L.moveHint;
    el.querySelector('.n-unsaved').hidden = !n.unsaved;
    const c = el.querySelector('.n-count');
    c.hidden = n.text.length < NOTE.countAt;
    c.textContent = `${num.format(n.text.length)} / ${num.format(NOTE.maxText)}`;
    const key = `${n.font}|${n.size}|${n.text}`;
    if (el._key !== key) { el._key = key; drawView(n); n.over = fitNote(n); }
  }
  const paintAll = () => { for (const n of notes) paintNote(n); notesEl.hidden = !notes.length; };

  function buildNote(n) {
    const el = document.createElement('div');
    el.className = 'note'; el.dataset.id = n.id; el.setAttribute('role', 'group');
    el.innerHTML = `<div class="n-paper"></div><span class="n-ear" hidden></span><div class="n-head"><span class="n-hint" id="nh-${n.id}">${esc(L.moveHint)}</span><span class="n-unsaved" hidden>${NICON.warn}${esc(L.notSaved)}</span></div><div class="n-body"><div class="n-view" aria-hidden="true"></div><textarea class="n-text" maxlength="${NOTE.maxText}" spellcheck="false" aria-describedby="nh-${n.id}" aria-label="${esc(L.noteText)}" placeholder="${esc(L.notePlaceholder)}"></textarea></div><span class="n-count" hidden></span>`;
    el.querySelector('.n-text').value = n.text;
    n.last = n.text;
    noteEls.set(n.id, el);
    notesEl.appendChild(el);
    notesEl.hidden = false;
    paintNote(n);
    n.wasOver = n.over;
    return el;
  }

  function syncCtl() {
    const nb = $('#newNote'), gb = $('#gatherNotes');
    const full = notes.length >= NOTE.max;
    const off = (b, why) => { b.setAttribute('aria-disabled', why === false ? 'false' : 'true'); if (why) { b.setAttribute('aria-description', why); b.title = why; } else { b.removeAttribute('aria-description'); b.removeAttribute('title'); } };
    off(nb, !notesReady ? '' : full ? L.notesLimit : false);
    off(gb, !notesReady ? '' : notes.length ? false : L.noNotes);
    $('#gatherCount').textContent = notesReady ? num.format(notes.length) : '';
  }

  function drawStatus() {
    const el = $('#nStatus');
    const msg = transient ? transient.text : placing ? L.placeHint : saveFailed ? L.saveFailed : '';
    const undo = transient && transient.undo;
    el.hidden = !msg;
    el.innerHTML = msg ? `<span class="n-msg">${esc(msg)}</span>` + (undo ? `<button type="button" class="fbtn n-undo">${esc(L.undo)}</button>` : '') : '';
  }
  function setStatus(text, undo) {
    clearTimeout(statusTimer);
    transient = text ? { text, undo } : null;
    if (transient) statusTimer = setTimeout(() => { transient = null; drawStatus(); }, 10000);
    drawStatus();
  }
  const sayNotes = (t) => { flipN = !flipN; $('#notesLive').textContent = t + (flipN ? '' : ' '); };
  const placedSoon = () => { clearTimeout(placedTimer); placedTimer = setTimeout(() => sayNotes(L.notePlaced), 1000); };

  function front(n) {
    if (n.z >= topZ() && notes.filter((m) => m.z === n.z).length === 1) return;
    n.z = topZ() + 1;
    paintNote(n);
    persist();
  }

  function setPos(n, left, top, say) {
    const { w, h } = vp();
    const p = clampPos(left, top, w, h);
    const a = anchorOf(p.left, p.top, w, h);
    n.x = a.x; n.y = a.y;
    paintNote(n);
    persist();
    if (say) placedSoon();
  }

  function newNote() {
    if (!notesReady || notes.length >= NOTE.max) return;
    const { w, h } = vp();
    const slot = pileSlot(0, w, h);
    const a = anchorOf(slot.left, slot.top, w, h);
    const n = { id: newId(), text: '', x: a.x, y: a.y, z: topZ() + 1, angle: randomTilt(Math.random()), ...FRESH, fresh: true, unsaved: false };
    notes.push(n);
    buildNote(n);
    syncCtl();
    noteEls.get(n.id).querySelector('.n-text').focus();
  }

  function removeNote(n) { // a delete made in this tab; a note another tab deleted is only dropped, so its Undo there can bring it back
    clearTimeout(saveTimer); saveTimer = 0;
    gone.add(n.id);
    dropNote(n);
  }
  function dropNote(n) {
    if (placing === n.id) stopPlacing();
    if (menuNote === n.id) closeMenu(false);
    const el = noteEls.get(n.id);
    if (el) el.remove();
    noteEls.delete(n.id);
    notes.splice(notes.indexOf(n), 1);
    notesEl.hidden = !notes.length;
    syncCtl();
  }

  function deleteNote(n) {
    const i = notes.indexOf(n);
    const next = notes[i + 1] || notes[i - 1];
    const keep = n.text ? { ...n } : null;
    removeNote(n);
    persist();
    if (next) noteEls.get(next.id).querySelector('.n-text').focus(); else $('#newNote').focus();
    if (!keep) return;
    setStatus(L.noteDeleted, () => {
      if (notes.length >= NOTE.max) { setStatus(L.notesLimit); return; }
      keep.fresh = false; keep.unsaved = false; gone.delete(keep.id);
      notes.splice(Math.min(i, notes.length), 0, keep);
      buildNote(keep);
      persist(); syncCtl();
      noteEls.get(keep.id).querySelector('.n-text').focus();
    });
  }

  // Gather: a messy pile in the bottom-right corner, every note a little off and tilted; the stacking order is kept.
  function settleAnim() {
    for (const el of noteEls.values()) el.classList.add('gathering');
    setTimeout(() => { for (const el of noteEls.values()) el.classList.remove('gathering'); }, 650);
  }
  function gather() {
    if (!notes.length) return;
    const before = notes.map((n) => ({ n, x: n.x, y: n.y, angle: n.angle }));
    const { w, h } = vp();
    const slots = messyPile(notes.length, w, h, Math.random);
    settleAnim();
    notes.slice().sort((a, b) => effZ(b) - effZ(a)).forEach((n, rank) => {
      const sl = slots[rank], a = anchorOf(sl.left, sl.top, w, h);
      n.x = a.x; n.y = a.y; n.angle = sl.angle; n.piled = true;
    });
    paintAll(); persist();
    setStatus(L.notesGathered(notes.length), () => {
      settleAnim();
      for (const b of before) if (notes.includes(b.n)) { b.n.x = b.x; b.n.y = b.y; b.n.angle = b.angle; b.n.piled = false; }
      paintAll(); persist();
      $('#gatherNotes').focus();
    });
  }

  function startPlacing(n) {
    placing = n.id;
    document.body.classList.add('placing');
    drawStatus();
  }
  function stopPlacing() {
    placing = null;
    document.body.classList.remove('placing');
    drawStatus();
  }

  function onDragMove(e) {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) <= 4) return;
    const el = noteEls.get(drag.n.id);
    if (!drag.moved) { drag.moved = true; el.classList.add('lifted'); }
    const { w, h } = vp();
    const p = clampPos(drag.ox + dx, drag.oy + dy, w, h);
    el.style.left = `${p.left}px`; el.style.top = `${p.top}px`;
  }
  function onDragEnd() {
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragEnd);
    window.removeEventListener('pointercancel', onDragEnd);
    const d = drag; drag = null;
    if (!d || !noteEls.has(d.n.id)) return;
    const el = noteEls.get(d.n.id);
    if (!d.moved) { // a click on a piled note pulls it out of the pile and into the text
      if (d.wasPiled) { d.n.piled = false; paintNote(d.n); el.querySelector('.n-text').focus(); }
      return;
    }
    el.classList.remove('lifted');
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
    d.n.fresh = false; d.n.piled = false;
    d.n.angle = settleAngle(d.n.angle, Math.random()); // it settles at a new tilt close to the old one
    setPos(d.n, snapGrid(parseFloat(el.style.left)), snapGrid(parseFloat(el.style.top)), true);
  }
  // The pointer can come down over a link under the note's transparent paper; the browser would then start a native link drag and cancel the pointer mid-move.
  document.addEventListener('dragstart', (e) => { if (drag) e.preventDefault(); }, true);
  const noteOf = (target) => { const el = target.closest && target.closest('.note'); return el ? byId(el.dataset.id) : null; };

  notesEl.addEventListener('pointerdown', (e) => {
    const n = noteOf(e.target);
    if (!n) return;
    const el = noteEls.get(n.id);
    el.classList.remove('gathering');
    front(n);
    const grab = e.target.closest('.n-head') || n.piled;
    if (e.button !== 0 || !grab) return;
    drag = { n, sx: e.clientX, sy: e.clientY, ox: el.offsetLeft, oy: el.offsetTop, moved: false, wasPiled: !!n.piled };
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragEnd);
    window.addEventListener('pointercancel', onDragEnd);
  });
  notesEl.addEventListener('focusin', (e) => {
    const n = noteOf(e.target);
    if (!n) return;
    if (n.piled && !(drag && drag.n === n)) { n.piled = false; paintNote(n); }
    front(n);
  });

  // ---- text: quick list, title emphasis, and the paper never overflows ----
  const lineBounds = (v, pos) => { const s = v.lastIndexOf('\n', pos - 1) + 1; let e = v.indexOf('\n', pos); if (e < 0) e = v.length; return [s, e]; };
  // Called after any change of the text: draw it, step the font down, or refuse input that cannot fit even at the smallest size.
  function commitText(n, ta, before) {
    n.text = ta.value; n.fresh = false;
    paintNote(n);
    if (n.over && !n.wasOver && n.text.length > n.last.length) {
      ta.value = n.last; n.text = n.last;
      if (before) ta.setSelectionRange(before[0], before[1]);
      paintNote(n);
      sayNotes(L.noteFull);
    }
    n.last = n.text; n.wasOver = n.over;
    persistSoon();
  }
  function strikeLine(n, ta, pos) {
    const [s, e] = lineBounds(ta.value, pos);
    const line = ta.value.slice(s, e), next = toggleStrike(line);
    if (next === line) return false;
    ta.setRangeText(next, s, e, 'preserve');
    commitText(n, ta, null);
    return true;
  }
  notesEl.addEventListener('beforeinput', (e) => {
    const n = noteOf(e.target);
    if (n && e.target.matches('.n-text')) n.sel = [e.target.selectionStart, e.target.selectionEnd];
  });
  notesEl.addEventListener('input', (e) => {
    const n = noteOf(e.target);
    if (!n || !e.target.matches('.n-text')) return;
    const ta = e.target;
    if (e.inputType === 'insertText' && e.data === ' ' && ta.selectionStart === ta.selectionEnd) { // "- " or "* " at the start of a line: a bullet
      const pos = ta.selectionStart, [s] = lineBounds(ta.value, pos);
      const pre = ta.value.slice(s, pos);
      if (pre === '- ' || pre === '* ') ta.setRangeText(`${BULLET} `, s, pos, 'end');
    }
    commitText(n, ta, n.sel);
  });
  notesEl.addEventListener('scroll', (e) => {
    if (!e.target.matches || !e.target.matches('.n-text')) return;
    e.target.parentNode.querySelector('.n-view').scrollTop = e.target.scrollTop;
  }, true);
  notesEl.addEventListener('focusout', (e) => {
    const n = noteOf(e.target);
    const el = n && noteEls.get(n.id);
    if (!n || (e.relatedTarget && el.contains(e.relatedTarget))) return;
    setTimeout(() => {
      if (!notes.includes(n) || el.contains(document.activeElement) || (drag && drag.n === n) || placing === n.id || menuNote === n.id) return;
      if (n.fresh && !n.text) { removeNote(n); return; }
      persist();
    }, 0);
  });
  notesEl.addEventListener('click', (e) => {
    const n = noteOf(e.target);
    if (!n) return;
    // a plain click on a bullet line strikes it through like a pencil; clicking again clears it
    const ta = e.target.closest('.n-text');
    if (ta && e.detail === 1 && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey && ta.selectionStart === ta.selectionEnd && !suppressClick) strikeLine(n, ta, ta.selectionStart);
  });
  notesEl.addEventListener('keydown', (e) => {
    const n = noteOf(e.target);
    if (!n) return;
    if ((e.key === 'F10' && e.shiftKey) || e.key === 'ContextMenu') { // keyboard path to the note menu
      e.preventDefault();
      const r = noteEls.get(n.id).getBoundingClientRect();
      openMenu(n, r.left + 16, r.top + 32, e.target);
      return;
    }
    const ta = e.target.matches('.n-text') ? e.target : null;
    if (ta && e.key === 'Escape' && n.fresh && !n.text) { e.preventDefault(); removeNote(n); $('#newNote').focus(); return; }
    if (ta && e.key === 'Enter' && !e.isComposing && !e.altKey && !e.shiftKey && ta.selectionStart === ta.selectionEnd) {
      const pos = ta.selectionStart, [s, le] = lineBounds(ta.value, pos);
      const line = ta.value.slice(s, le), kind = lineKind(line);
      if (kind && (e.ctrlKey || e.metaKey)) { e.preventDefault(); strikeLine(n, ta, pos); return; } // keyboard way to strike a bullet
      if (kind && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        n.sel = [pos, pos];
        if (line.length <= 2) ta.setRangeText('', s, le, 'end'); // Enter on an empty bullet ends the list
        else ta.setRangeText(`\n${BULLET} `, pos, pos, 'end'); // Enter in a bullet starts the next one
        commitText(n, ta, n.sel);
        return;
      }
    }
    const d = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!d || !ta || !e.altKey || e.ctrlKey || e.metaKey) return; // Alt+arrow moves the note; plain arrows move the caret
    e.preventDefault();
    const step = NOTE.grid * (e.shiftKey ? 4 : 1);
    const el = noteEls.get(n.id);
    setPos(n, snapGrid(el.offsetLeft + d[0] * step), snapGrid(el.offsetTop + d[1] * step), true);
  });
  // The note's own menu replaces the browser's. Kept inside the screen edges.
  notesEl.addEventListener('contextmenu', (e) => {
    const n = noteOf(e.target);
    if (!n) return;
    e.preventDefault();
    if (menuEl && performance.now() - menuAt < 400) return; // the keyboard path already opened it
    openMenu(n, e.clientX, e.clientY, noteEls.get(n.id).querySelector('.n-text'));
  });

  // ---- the note menu ----
  const MENU_W = 232;
  let menuEl = null, menuNote = null, menuOpener = null, menuAt = 0;
  const colorName = { yellow: 'colYellow', pink: 'colPink', mint: 'colMint', blue: 'colBlue', orange: 'colOrange' };
  const fontName = { caveat: 'Caveat', kalam: 'Kalam', patrick: 'Patrick Hand', architects: 'Architects Daughter' };
  function menuItems() { return menuEl ? [...menuEl.querySelectorAll('button[data-act]:not([aria-disabled="true"])')] : []; }
  function syncMenu() {
    const n = byId(menuNote);
    if (!menuEl || !n) return;
    for (const b of menuEl.querySelectorAll('[data-act="color"]')) b.setAttribute('aria-checked', String(b.dataset.v === n.color));
    for (const b of menuEl.querySelectorAll('[data-act="font"]')) b.setAttribute('aria-checked', String(b.dataset.v === n.font));
    menuEl.querySelector('[data-act="pin"]').setAttribute('aria-checked', String(n.pinned));
    menuEl.querySelector('[data-act="up"]').setAttribute('aria-disabled', String(stepSize(n.size, 1) == null));
    menuEl.querySelector('[data-act="down"]').setAttribute('aria-disabled', String(stepSize(n.size, -1) == null));
  }
  function openMenu(n, x, y, opener) {
    closeMenu(false);
    menuNote = n.id; menuOpener = opener; menuAt = performance.now();
    const m = document.createElement('div');
    m.className = 'n-menu'; m.setAttribute('role', 'menu'); m.setAttribute('aria-label', L.noteMenu(noteTitle(n.text) || L.newNote));
    const item = (act, v, label, extra = '') => `<button type="button" role="menuitem${extra}" class="nm-it" data-act="${act}"${v ? ` data-v="${v}"` : ''}>${label}</button>`;
    m.innerHTML = `<div class="nm-sw" role="group" aria-label="${esc(L.mColor)}">${COLORS.map((c) => `<button type="button" role="menuitemradio" data-act="color" data-v="${c}" style="--sw: var(--nc-${c})" aria-label="${esc(L[colorName[c]])}" title="${esc(L[colorName[c]])}"></button>`).join('')}</div>`
      + `<div class="nm-fonts" role="group" aria-label="${esc(L.mFont)}">${FONTS.map((f) => item('font', f, f === 'sans' ? esc(L.fontPlain) : `<span class="nm-f-${f}">${fontName[f]}</span>`, 'radio')).join('')}</div>`
      + `<div class="nm-row" role="group" aria-label="${esc(L.mSize)}"><button type="button" role="menuitem" class="nm-it" data-act="down" aria-label="${esc(L.sizeDown)}" title="${esc(L.sizeDown)}">A&minus;</button><button type="button" role="menuitem" class="nm-it" data-act="up" aria-label="${esc(L.sizeUp)}" title="${esc(L.sizeUp)}">A+</button></div>`
      + `<div class="nm-fonts" role="group" aria-label="${esc(L.mTilt)}" style="border-top:1px solid var(--rule-soft);margin-top:4px;padding-top:4px">${item('random', '', esc(L.tiltRandom))}${item('reset', '', esc(L.tiltReset))}</div>`
      + `${item('move', '', esc(L.moveItem))}${item('pin', '', esc(L.pinFront), 'checkbox')}${item('delete', '', esc(L.deleteNoteMenu)).replace('class="nm-it"', 'class="nm-it nm-del"')}`;
    document.body.appendChild(m);
    menuEl = m;
    const r = m.getBoundingClientRect(), p = menuPos(x, y, r.width, r.height, vp().w, vp().h);
    m.style.left = `${p.left}px`; m.style.top = `${p.top}px`;
    syncMenu();
    (m.querySelector(`[data-act="color"][data-v="${n.color}"]`) || menuItems()[0]).focus();
  }
  function closeMenu(refocus) {
    if (!menuEl) return;
    const id = menuNote, opener = menuOpener;
    menuEl.remove(); menuEl = null; menuNote = null; menuOpener = null;
    const el = noteEls.get(id);
    if (!refocus) return;
    const back = opener && opener.isConnected ? opener : el && el.querySelector('.n-text');
    if (back) back.focus({ preventScroll: true });
  }
  document.addEventListener('click', (e) => {
    const b = menuEl && e.target.closest && e.target.closest('.n-menu button[data-act]');
    if (!b) return;
    const n = byId(menuNote);
    if (!n || b.getAttribute('aria-disabled') === 'true') return;
    const act = b.dataset.act, v = b.dataset.v;
    if (act === 'color') { n.color = v; paintNote(n); persist(); closeMenu(true); }
    else if (act === 'font') { n.font = v; paintNote(n); persist(); closeMenu(true); }
    else if (act === 'up' || act === 'down') { n.size = stepSize(n.size, act === 'up' ? 1 : -1); paintNote(n); persist(); syncMenu(); } // stays open: click again and again
    else if (act === 'random') { n.angle = randomTilt(Math.random()); paintNote(n); persist(); }
    else if (act === 'reset') { n.angle = 0; paintNote(n); persist(); }
    else if (act === 'pin') { n.pinned = !n.pinned; paintNote(n); persist(); closeMenu(true); }
    else if (act === 'move') { closeMenu(false); startPlacing(n); }
    else if (act === 'delete') { closeMenu(false); deleteNote(n); }
  });
  document.addEventListener('keydown', (e) => {
    if (!menuEl || !menuEl.contains(e.target)) return;
    const items = menuItems(), i = items.indexOf(document.activeElement);
    const go = (k) => { e.preventDefault(); if (items.length) items[(k + items.length) % items.length].focus(); };
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') go(i + 1);
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') go(i - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(items.length - 1);
    else if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); closeMenu(true); }
    else if ((e.key === 'F10' && e.shiftKey) || e.key === 'ContextMenu') { e.preventDefault(); }
  }, true);
  document.addEventListener('pointerdown', (e) => { if (menuEl && !menuEl.contains(e.target)) closeMenu(false); }, true);
  window.addEventListener('blur', () => closeMenu(false));
  document.addEventListener('contextmenu', (e) => { if (menuEl && menuEl.contains(e.target)) e.preventDefault(); });

  // Click to place (WCAG 2.5.7): the next click on the page puts the note's top-left corner there
  document.addEventListener('click', (e) => {
    if (!placing) return;
    if (e.detail === 0) return; // a keyboard activation has no place to put the note
    e.preventDefault(); e.stopPropagation();
    const n = byId(placing);
    stopPlacing();
    if (n) setPos(n, snapGrid(e.clientX), snapGrid(e.clientY), true);
  }, true);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !placing) return;
    const el = noteEls.get(placing);
    stopPlacing();
    if (el) el.querySelector('.n-text').focus();
  });
  // Focus reveal (WCAG 2.4.11): notes that completely cover the control keyboard focus lands on step aside
  const revealed = new Set();
  const unreveal = () => { for (const el of revealed) el.classList.remove('reveal'); revealed.clear(); };
  document.addEventListener('focusin', (e) => {
    unreveal();
    const t = e.target;
    if (!t || !t.getBoundingClientRect || t.closest('.notes, .nctl, .n-menu')) return;
    const b = t.getBoundingClientRect();
    for (const el of noteEls.values()) {
      const r = el.getBoundingClientRect();
      if (b.width && b.left >= r.left && b.right <= r.right && b.top >= r.top && b.bottom <= r.bottom) { el.classList.add('reveal'); revealed.add(el); }
    }
  });
  document.addEventListener('focusout', (e) => { if (!e.relatedTarget) unreveal(); });
  window.addEventListener('resize', paintAll);
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => { for (const el of noteEls.values()) el._key = ''; paintAll(); }); // a handwriting font arrived: measure again

  $('#newNote').addEventListener('click', () => { if ($('#newNote').getAttribute('aria-disabled') !== 'true') newNote(); });
  $('#gatherNotes').addEventListener('click', () => { if ($('#gatherNotes').getAttribute('aria-disabled') !== 'true') gather(); });
  $('#nStatus').addEventListener('click', (e) => {
    if (!e.target.closest('.n-undo') || !transient || !transient.undo) return;
    const undo = transient.undo;
    setStatus(null);
    undo();
  });
  notesEl.setAttribute('aria-label', L.notes);

  // Called once at load: notes come from browser storage, never from the server or the GitHub scan.
  function initNotes(demo) {
    if (notesReady) return;
    notesReady = true;
    notesStore = demo ? memStore : store;
    const s = sanitizeNotes(notesStore.get(NOTES_KEY));
    notes = s.notes; rest = s.rest;
    if (s.bad) rawBad = notesStore.get(NOTES_KEY);
    for (const n of notes) known.add(n.id);
    if (!demo) window.addEventListener('storage', (e) => { if (e.key === NOTES_KEY && e.storageArea === localStorage) mergeStored(true); });
    for (const n of notes) buildNote(n);
    paintAll(); syncCtl();
  }

  initNotes(DEMO_PAGE);
  render();
  poll(false);
  setInterval(() => poll(false), 4000);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
