name: App

# Unit tests and the browser check for the one-page app (index.html). Runs on GitHub-hosted
# runners (the repo is public). No secrets and never pull_request_target: this workflow also
# runs for fork PRs. The browser check borrows Playwright from web/ (one npm ci there).

on:
  pull_request:
    paths:
      - 'index.html'
      - 'server.mjs'
      - 'demo.mjs'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/app.yml'
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'server.mjs'
      - 'demo.mjs'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Unit tests and browser check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm test

      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:browser

      - name: Keep the screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: section-resize-screenshots
          path: test/screenshots/
          if-no-files-found: ignore
